<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yoonou — Admin · Vérification téléphone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --indigo-deep:#16213E; --indigo-panel:#1F2E52;
    --laterite:#C1502E; --laterite-bright:#E0623C;
    --sand:#F3E9D2; --sand-dim:#E6D9BB;
    --teal:#2A7F76; --gold:#E8A93A;
    --ink:#1A1712; --muted:#4a4438;
    --cta-red:#D6362A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Work Sans', sans-serif; background:var(--sand); color:var(--ink); min-height:100vh; padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  h1,h2{font-family:'Space Grotesk', sans-serif; font-weight:700;}
  nav{background:var(--indigo-deep); padding:calc(18px + env(safe-area-inset-top)) 0 18px;}
  nav .wrap{max-width:900px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center;}
  .logo{font-family:'Space Grotesk'; font-weight:700; font-size:20px; color:var(--sand); display:flex; align-items:center; gap:8px; text-decoration:none;}
  .logo .dot{width:9px; height:9px; border-radius:50%; background:var(--laterite-bright);}
  .nav-link{color:var(--sand-dim); text-decoration:none; font-size:13.5px; font-family:'Space Grotesk'; font-weight:600;}
  .wrap{max-width:900px; margin:0 auto; padding:44px 24px;}
  .loading{text-align:center; padding:80px 20px; color:var(--muted);}
  .hidden{display:none !important;}

  h1{font-size:26px; margin-bottom:6px;}
  .subtitle{color:var(--muted); font-size:14.5px; margin-bottom:28px;}
  .count-pill{font-family:'JetBrains Mono'; font-size:12px; background:rgba(22,33,62,0.08); color:var(--muted); padding:3px 10px; border-radius:100px; margin-left:8px;}

  .empty-note{color:var(--muted); font-size:14.5px; padding:24px; background:#fff; border-radius:12px; border:1px solid rgba(22,33,62,0.08); text-align:center;}

  .item{background:#fff; border-radius:12px; padding:24px; border:1px solid rgba(22,33,62,0.08); margin-bottom:16px;}
  .item.expired{opacity:0.6;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px;}
  .user-name{font-family:'Space Grotesk'; font-weight:700; font-size:16px;}
  .user-phone{color:var(--muted); font-size:13.5px; font-family:'JetBrains Mono';}
  .role-badge{font-family:'JetBrains Mono'; font-size:11px; padding:4px 11px; border-radius:100px; font-weight:600; background:rgba(22,33,62,0.08); color:var(--indigo-deep);}

  .expected-code{
    font-family:'JetBrains Mono'; font-size:22px; font-weight:700; letter-spacing:.1em;
    background:var(--sand); border-radius:8px; padding:12px 16px; margin:12px 0; text-align:center; color:var(--indigo-deep);
  }
  .expiry-note{font-size:12px; color:var(--muted); text-align:center; margin-top:-6px; margin-bottom:12px;}
  .expiry-note.expired{color:var(--cta-red); font-weight:600;}

  .action-row{display:flex; gap:10px; flex-wrap:wrap;}
  .wa-check-link{
    display:inline-flex; align-items:center; gap:6px; font-family:'Space Grotesk'; font-weight:600; font-size:13.5px;
    color:#1EBE5A; text-decoration:none; padding:11px 18px; border:1.5px solid #25D366; border-radius:6px;
  }
  .wa-check-link:hover{background:rgba(37,211,102,0.08);}
  .btn-confirm{
    font-family:'Space Grotesk'; font-weight:700; font-size:13.5px; padding:11px 20px; border-radius:6px;
    border:none; background:var(--teal); color:#fff; cursor:pointer;
  }
  .btn-confirm:hover{background:#236b63;}
  .btn-confirm:disabled{opacity:0.5; cursor:not-allowed;}

  .item-msg{font-size:13px; margin-top:10px; padding:9px; border-radius:6px; display:none;}
  .item-msg.error{display:block; background:rgba(193,80,46,0.1); color:var(--laterite);}
  .item-msg.success{display:block; background:rgba(42,127,118,0.1); color:var(--teal);}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="espace.html" class="logo"><span class="dot"></span>Yoonou</a>
    <a href="admin-dashboard.html" class="nav-link">← Vue d'ensemble</a>
  </div>
</nav>

<div class="wrap">
  <div id="loadingState" class="loading">Chargement...</div>

  <div id="content" class="hidden">
    <h1>Vérification téléphone<span class="count-pill" id="countPill">0</span></h1>
    <p class="subtitle">Ouvre WhatsApp, vérifie que le message reçu vient bien de ce numéro et contient bien ce code, puis confirme.</p>
    <div id="list"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://fifzavvciqvdollbqigx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnphdnZjaXF2ZG9sbGJxaWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzMwNDgsImV4cCI6MjEwMjIwOTA0OH0.-Uj4_dULEPY4AfswEuUiC-4IOTOPOZd9j7JZD7pSTmY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const roleLabels = { client: 'Client', transporteur: 'Transporteur', admin: 'Admin' };

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'auth.html'; return; }

    const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
    if (!profile || profile.role !== 'admin') { window.location.href = 'espace.html'; return; }

    await loadList();

    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  async function loadList(){
    const list = document.getElementById('list');
    const countPill = document.getElementById('countPill');

    const { data, error } = await sb
      .from('profiles')
      .select('id, prenom, nom, whatsapp, role, code_verification, code_verification_expire_at, code_verification_demande_at')
      .eq('telephone_verifie', false)
      .not('code_verification', 'is', null)
      .order('code_verification_demande_at', { ascending: true });

    if (error) { console.error(error); list.innerHTML = '<div class="empty-note">Erreur de chargement.</div>'; return; }

    countPill.textContent = (data || []).length;

    if (!data || data.length === 0) {
      list.innerHTML = '<div class="empty-note">Aucune vérification en attente. 🎉</div>';
      return;
    }

    list.innerHTML = data.map(p => renderItem(p)).join('');
    data.forEach(p => {
      const btn = document.getElementById('confirm-' + p.id);
      if (btn) btn.addEventListener('click', () => confirmer(p.id, p.code_verification));
    });
  }

  function renderItem(p){
    const expired = p.code_verification_expire_at && new Date(p.code_verification_expire_at) < new Date();
    const cleanPhone = (p.whatsapp || '').replace(/[^0-9]/g, '');
    const waLink = cleanPhone ? `https://wa.me/${cleanPhone}` : null;

    return `
      <div class="item ${expired ? 'expired' : ''}" id="item-${p.id}">
        <div class="item-top">
          <div>
            <div class="user-name">${escapeHtml(p.prenom || '')} ${escapeHtml(p.nom || '')}</div>
            <div class="user-phone">${escapeHtml(p.whatsapp || '—')}</div>
          </div>
          <span class="role-badge">${roleLabels[p.role] || p.role}</span>
        </div>

        <div class="expected-code">${escapeHtml(p.code_verification)}</div>
        <div class="expiry-note ${expired ? 'expired' : ''}">
          ${expired ? '⏰ Code expiré — l\'utilisateur doit en générer un nouveau' : 'Expire le ' + new Date(p.code_verification_expire_at).toLocaleString('fr-FR')}
        </div>

        <div class="action-row">
          ${waLink ? `<a href="${waLink}" target="_blank" class="wa-check-link">💬 Ouvrir la conversation WhatsApp</a>` : ''}
          <button class="btn-confirm" id="confirm-${p.id}" ${expired ? 'disabled' : ''}>✅ Confirmer reçu</button>
        </div>
        <div class="item-msg" id="msg-${p.id}"></div>
      </div>
    `;
  }

  async function confirmer(userId, code){
    const btn = document.getElementById('confirm-' + userId);
    const msg = document.getElementById('msg-' + userId);
    btn.disabled = true;
    msg.className = 'item-msg';

    try {
      const { data, error } = await sb.rpc('valider_telephone', {
        p_user_id: userId,
        p_code: code,
        p_methode: 'manuel_whatsapp'
      });
      if (error) throw error;

      if (data === true) {
        msg.textContent = '✅ Numéro vérifié.';
        msg.className = 'item-msg success';
        setTimeout(loadList, 900);
      } else {
        throw new Error('Le code a expiré ou a changé entre-temps.');
      }
    } catch (err) {
      console.error(err);
      msg.textContent = 'Erreur : ' + (err.message || 'réessaie.');
      msg.className = 'item-msg error';
      btn.disabled = false;
    }
  }

  function escapeHtml(str){
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
</script>
</body>
</html>
