<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yoonou — Admin · Marchandises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{--indigo-deep:#16213E; --laterite:#C1502E; --sand:#F3E9D2; --sand-dim:#E6D9BB; --teal:#2A7F76; --gold:#E8A93A; --ink:#1A1712; --muted:#4a4438; --cta-red:#D6362A;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Work Sans', sans-serif; background:var(--sand); color:var(--ink); min-height:100vh; padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  h1,h2{font-family:'Space Grotesk', sans-serif; font-weight:700;}
  nav{background:var(--indigo-deep); padding:calc(18px + env(safe-area-inset-top)) 0 18px;}
  nav .wrap{max-width:800px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center;}
  .logo{font-family:'Space Grotesk'; font-weight:700; font-size:20px; color:var(--sand); text-decoration:none;}
  .nav-link{color:var(--sand-dim); text-decoration:none; font-size:13.5px; font-family:'Space Grotesk'; font-weight:600;}
  .wrap{max-width:800px; margin:0 auto; padding:40px 24px;}
  .loading{text-align:center; padding:80px 20px; color:var(--muted);}
  .hidden{display:none !important;}
  h1{font-size:26px; margin-bottom:6px;}
  .subtitle{color:var(--muted); font-size:14px; margin-bottom:24px;}
  .row{background:#fff; border-radius:10px; padding:18px 20px; border:1px solid rgba(22,33,62,0.08); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;}
  .cat-name{font-family:'Space Grotesk'; font-weight:700; font-size:14.5px; min-width:140px;}
  select{padding:8px 10px; border-radius:6px; border:1.5px solid rgba(22,33,62,0.15); font-size:13px; font-family:'Space Grotesk'; font-weight:600;}
  .note-input{flex:1; min-width:180px; padding:8px 10px; border-radius:6px; border:1.5px solid rgba(22,33,62,0.15); font-size:13px;}
  .save-btn{font-family:'Space Grotesk'; font-weight:600; font-size:12.5px; padding:8px 14px; border-radius:6px; border:none; background:var(--teal); color:#fff; cursor:pointer;}
  .save-btn:disabled{opacity:0.5;}
  .msg{font-size:12px; margin-left:8px;}
</style>
</head>
<body>
<nav><div class="wrap"><a href="espace.html" class="logo">Yoonou</a><a href="admin-dashboard.html" class="nav-link">← Vue d'ensemble</a></div></nav>
<div class="wrap">
  <div id="loadingState" class="loading">Chargement...</div>
  <div id="content" class="hidden">
    <h1>Marchandises autorisées</h1>
    <p class="subtitle">Change le statut d'une catégorie sans toucher au code. Les clients voient l'avertissement immédiatement.</p>
    <div id="list"></div>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://fifzavvciqvdollbqigx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnphdnZjaXF2ZG9sbGJxaWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzMwNDgsImV4cCI6MjEwMjIwOTA0OH0.-Uj4_dULEPY4AfswEuUiC-4IOTOPOZd9j7JZD7pSTmY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const labels = { colis:'Colis', cartons:'Cartons', meubles:'Meubles', electromenager:'Électroménager', alimentation:'Alimentation', vetements:'Vêtements', materiaux:'Matériaux', animaux:'Animaux', commerciale:'Marchandises commerciales', autre:'Autre' };

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'auth.html'; return; }
    const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
    if (!profile || profile.role !== 'admin') { window.location.href = 'espace.html'; return; }
    await loadList();
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  async function loadList(){
    const { data, error } = await sb.from('cargo_restrictions').select('*').order('categorie');
    const list = document.getElementById('list');
    if (error) { list.innerHTML = 'Erreur.'; return; }
    list.innerHTML = data.map(r => `
      <div class="row" id="row-${r.id}">
        <span class="cat-name">${labels[r.categorie] || r.categorie}</span>
        <select id="statut-${r.id}">
          <option value="ALLOWED" ${r.statut==='ALLOWED'?'selected':''}>✅ Autorisé</option>
          <option value="RESTRICTED" ${r.statut==='RESTRICTED'?'selected':''}>⚠️ Sous conditions</option>
          <option value="REQUIRES_REVIEW" ${r.statut==='REQUIRES_REVIEW'?'selected':''}>🔍 Vérification requise</option>
          <option value="PROHIBITED" ${r.statut==='PROHIBITED'?'selected':''}>⛔ Interdit</option>
        </select>
        <input type="text" class="note-input" id="note-${r.id}" value="${(r.note||'').replace(/"/g,'&quot;')}" placeholder="Note affichée au client (optionnel)">
        <button class="save-btn" id="save-${r.id}">Enregistrer</button>
        <span class="msg" id="msg-${r.id}"></span>
      </div>
    `).join('');
    data.forEach(r => {
      document.getElementById('save-' + r.id).addEventListener('click', () => saveRow(r.id));
    });
  }

  async function saveRow(id){
    const btn = document.getElementById('save-' + id);
    const msg = document.getElementById('msg-' + id);
    btn.disabled = true;
    const statut = document.getElementById('statut-' + id).value;
    const note = document.getElementById('note-' + id).value.trim() || null;
    const { error } = await sb.from('cargo_restrictions').update({ statut, note, updated_at: new Date().toISOString() }).eq('id', id);
    msg.textContent = error ? '❌ Erreur' : '✅ Enregistré';
    msg.style.color = error ? 'var(--cta-red)' : 'var(--teal)';
    btn.disabled = false;
    setTimeout(() => msg.textContent = '', 2000);
  }

  init();
</script>
</body>
</html>
