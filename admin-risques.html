<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yoonou — Admin · Anomalies GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --indigo-deep:#16213E; --indigo-panel:#1F2E52;
    --laterite:#C1502E; --laterite-bright:#E0623C;
    --sand:#F3E9D2; --sand-dim:#E6D9BB;
    --teal:#2A7F76; --gold:#E8A93A;
    --ink:#1A1712; --muted:#4a4438;
    --cta-red:#D6362A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Work Sans', sans-serif; background:var(--sand); color:var(--ink); min-height:100vh; padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  h1,h2{font-family:'Space Grotesk', sans-serif; font-weight:700;}
  nav{background:var(--indigo-deep); padding:calc(18px + env(safe-area-inset-top)) 0 18px;}
  nav .wrap{max-width:900px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center;}
  .logo{font-family:'Space Grotesk'; font-weight:700; font-size:20px; color:var(--sand); display:flex; align-items:center; gap:8px; text-decoration:none;}
  .logo .dot{width:9px; height:9px; border-radius:50%; background:var(--laterite-bright);}
  .nav-link{color:var(--sand-dim); text-decoration:none; font-size:13.5px; font-family:'Space Grotesk'; font-weight:600;}
  .wrap{max-width:900px; margin:0 auto; padding:40px 24px;}
  .loading{text-align:center; padding:80px 20px; color:var(--muted);}
  .hidden{display:none !important;}

  h1{font-size:26px; margin-bottom:6px;}
  .subtitle{color:var(--muted); font-size:14px; margin-bottom:24px;}

  .filter-tabs{display:flex; gap:8px; margin-bottom:20px;}
  .filter-tab{
    font-family:'Space Grotesk'; font-weight:600; font-size:13px; padding:9px 16px; border-radius:100px;
    border:1.5px solid rgba(22,33,62,0.15); background:#fff; color:var(--muted); cursor:pointer;
  }
  .filter-tab.active{background:var(--indigo-deep); color:var(--sand); border-color:var(--indigo-deep);}

  .empty-note{color:var(--muted); font-size:14px; padding:24px; background:#fff; border-radius:12px; border:1px solid rgba(22,33,62,0.08); text-align:center;}

  .item{background:#fff; border-radius:12px; padding:20px 22px; border:1px solid rgba(22,33,62,0.08); margin-bottom:14px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .item-route{font-family:'Space Grotesk'; font-weight:700; font-size:14.5px;}
  .item-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .speed-badge{
    font-family:'JetBrains Mono'; font-size:13px; font-weight:700; padding:5px 12px; border-radius:100px;
    background:rgba(214,54,42,0.1); color:var(--cta-red); white-space:nowrap;
  }
  .detail-row{font-size:13px; color:var(--muted); margin-top:8px;}
  .track-link{
    display:inline-flex; align-items:center; gap:6px; font-family:'Space Grotesk'; font-weight:600; font-size:13px;
    color:var(--teal); text-decoration:none; margin-top:10px;
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="espace.html" class="logo"><span class="dot"></span>Yoonou</a>
    <a href="admin-dashboard.html" class="nav-link">← Vue d'ensemble</a>
  </div>
</nav>

<div class="wrap">
  <div id="loadingState" class="loading">Chargement...</div>

  <div id="content" class="hidden">
    <h1>Anomalies GPS</h1>
    <p class="subtitle">Un signal, pas une accusation — souvent juste un problème de réseau ou de signal GPS. Vérifie le contexte avant toute décision.</p>

    <div class="filter-tabs">
      <button class="filter-tab active" data-hours="24">Dernières 24h</button>
      <button class="filter-tab" data-hours="168">7 derniers jours</button>
      <button class="filter-tab" data-hours="0">Tout l'historique</button>
    </div>

    <div id="list"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://fifzavvciqvdollbqigx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnphdnZjaXF2ZG9sbGJxaWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzMwNDgsImV4cCI6MjEwMjIwOTA0OH0.-Uj4_dULEPY4AfswEuUiC-4IOTOPOZd9j7JZD7pSTmY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'auth.html'; return; }
    const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
    if (!profile || profile.role !== 'admin') { window.location.href = 'espace.html'; return; }

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        loadList(parseInt(tab.dataset.hours));
      });
    });

    await loadList(24);
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  async function loadList(hours){
    const list = document.getElementById('list');
    let query = sb
      .from('risk_events')
      .select('*, orders(depart, destination, statut), profiles!risk_events_transporteur_id_fkey(prenom, nom, whatsapp)')
      .order('created_at', { ascending: false })
      .limit(100);

    if (hours > 0) {
      query = query.gte('created_at', new Date(Date.now() - hours * 60 * 60 * 1000).toISOString());
    }

    const { data, error } = await query;
    if (error) { console.error(error); list.innerHTML = '<div class="empty-note">Erreur de chargement.</div>'; return; }

    if (!data || data.length === 0) {
      list.innerHTML = '<div class="empty-note">Aucune anomalie sur cette période. 🎉</div>';
      return;
    }

    list.innerHTML = data.map(renderItem).join('');
  }

  function renderItem(e){
    const order = e.orders || {};
    const driver = e.profiles || {};
    const d = e.details || {};

    return `
      <div class="item">
        <div class="item-top">
          <div>
            <div class="item-route">${escapeHtml(order.depart || '—')} → ${escapeHtml(order.destination || '—')}</div>
            <div class="item-meta">${escapeHtml(driver.prenom || '')} ${escapeHtml(driver.nom || '')} · ${escapeHtml(driver.whatsapp || '—')} · ${new Date(e.created_at).toLocaleString('fr-FR')}</div>
          </div>
          <span class="speed-badge">≈ ${d.vitesse_kmh || '?'} km/h</span>
        </div>
        <div class="detail-row">${d.distance_km || '?'} km parcourus en ${d.delta_secondes || '?'}s · Statut commande : ${escapeHtml(order.statut || '—')} · Commande #${e.order_id ? e.order_id.slice(0,8) : '—'}</div>
      </div>
    `;
  }

  function escapeHtml(str){
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
</script>
</body>
</html>
