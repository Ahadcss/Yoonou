<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yoonou — Admin · Zones communautaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<style>
  :root{--indigo-deep:#16213E; --laterite:#C1502E; --sand:#F3E9D2; --sand-dim:#E6D9BB; --teal:#2A7F76; --gold:#E8A93A; --ink:#1A1712; --muted:#4a4438; --cta-red:#D6362A;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Work Sans', sans-serif; background:var(--sand); color:var(--ink); min-height:100vh; padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  h1,h2{font-family:'Space Grotesk', sans-serif; font-weight:700;}
  nav{background:var(--indigo-deep); padding:calc(18px + env(safe-area-inset-top)) 0 18px;}
  nav .wrap{max-width:800px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center;}
  .logo{font-family:'Space Grotesk'; font-weight:700; font-size:20px; color:var(--sand); text-decoration:none;}
  .nav-link{color:var(--sand-dim); text-decoration:none; font-size:13.5px; font-family:'Space Grotesk'; font-weight:600;}
  .wrap{max-width:800px; margin:0 auto; padding:40px 24px;}
  .loading{text-align:center; padding:80px 20px; color:var(--muted);}
  .hidden{display:none !important;}
  h1{font-size:26px; margin-bottom:6px;}
  .subtitle{color:var(--muted); font-size:14px; margin-bottom:24px;}
  .empty-note{color:var(--muted); font-size:14px; padding:24px; background:#fff; border-radius:12px; border:1px solid rgba(22,33,62,0.08); text-align:center;}
  .item{background:#fff; border-radius:12px; padding:22px; border:1px solid rgba(22,33,62,0.08); margin-bottom:14px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .zone-name{font-family:'Space Grotesk'; font-weight:700; font-size:15.5px;}
  .zone-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .zone-desc{font-size:13.5px; color:var(--ink); margin:10px 0;}
  .mini-map{width:100%; height:160px; border-radius:8px; margin-bottom:12px;}
  .action-row{display:flex; gap:10px;}
  .btn-approve{font-family:'Space Grotesk'; font-weight:700; font-size:13px; padding:9px 16px; border-radius:6px; border:none; background:var(--teal); color:#fff; cursor:pointer;}
  .btn-reject{font-family:'Space Grotesk'; font-weight:600; font-size:13px; padding:9px 16px; border-radius:6px; border:1.5px solid var(--laterite); background:none; color:var(--laterite); cursor:pointer;}
  button:disabled{opacity:0.5;}
  .item-msg{font-size:12px; margin-top:8px;}
</style>
</head>
<body>
<nav><div class="wrap"><a href="espace.html" class="logo">Yoonou</a><a href="admin-dashboard.html" class="nav-link">← Vue d'ensemble</a></div></nav>
<div class="wrap">
  <div id="loadingState" class="loading">Chargement...</div>
  <div id="content" class="hidden">
    <h1>Zones proposées</h1>
    <p class="subtitle">Vérifie l'emplacement sur la carte avant de valider.</p>
    <div id="list"></div>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://fifzavvciqvdollbqigx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnphdnZjaXF2ZG9sbGJxaWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzMwNDgsImV4cCI6MjEwMjIwOTA0OH0.-Uj4_dULEPY4AfswEuUiC-4IOTOPOZd9j7JZD7pSTmY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  mapboxgl.accessToken = 'pk.eyJ1IjoieW9vbm91MTIxMiIsImEiOiJjbXRuenZoeWcwaWIwMnhzN2lhanhscmFzIn0.gySOX9l6uD89_QHvp6ppKA';

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'auth.html'; return; }
    const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
    if (!profile || profile.role !== 'admin') { window.location.href = 'espace.html'; return; }
    await loadList();
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  async function loadList(){
    const { data, error } = await sb.from('zone_suggestions')
      .select('*, profiles!zone_suggestions_suggested_by_fkey(prenom, nom, role)')
      .eq('statut', 'EN_ATTENTE')
      .order('created_at', { ascending: true });
    const list = document.getElementById('list');
    if (error) { list.innerHTML = 'Erreur.'; return; }
    if (!data || data.length === 0) {
      list.innerHTML = '<div class="empty-note">Aucune zone en attente. 🎉</div>';
      return;
    }
    list.innerHTML = data.map(z => `
      <div class="item" id="item-${z.id}">
        <div class="item-top">
          <div>
            <div class="zone-name">📍 ${escapeHtml(z.nom_zone)}</div>
            <div class="zone-meta">Proposée par ${escapeHtml(z.profiles?.prenom || '')} ${escapeHtml(z.profiles?.nom || '')} (${z.profiles?.role || '—'}) · ${new Date(z.created_at).toLocaleDateString('fr-FR')}</div>
          </div>
        </div>
        ${z.description ? `<div class="zone-desc">${escapeHtml(z.description)}</div>` : ''}
        <div class="mini-map" id="map-${z.id}"></div>
        <div class="action-row">
          <button class="btn-approve" data-id="${z.id}" data-action="approve">✓ Valider</button>
          <button class="btn-reject" data-id="${z.id}" data-action="reject">✕ Rejeter</button>
        </div>
        <div class="item-msg" id="msg-${z.id}"></div>
      </div>
    `).join('');

    data.forEach(z => {
      const m = new mapboxgl.Map({
        container: 'map-' + z.id, style: 'mapbox://styles/mapbox/streets-v12',
        center: [z.longitude, z.latitude], zoom: 14, interactive: false
      });
      new mapboxgl.Marker({ color: '#2A7F76' }).setLngLat([z.longitude, z.latitude]).addTo(m);

      document.querySelector(`[data-id="${z.id}"][data-action="approve"]`).addEventListener('click', () => updateZone(z.id, 'APPROUVEE'));
      document.querySelector(`[data-id="${z.id}"][data-action="reject"]`).addEventListener('click', () => updateZone(z.id, 'REJETEE'));
    });
  }

  async function updateZone(id, statut){
    const item = document.getElementById('item-' + id);
    item.querySelectorAll('button').forEach(b => b.disabled = true);
    const { error } = await sb.from('zone_suggestions').update({ statut }).eq('id', id);
    const msg = document.getElementById('msg-' + id);
    msg.textContent = error ? 'Erreur' : (statut === 'APPROUVEE' ? '✅ Validée' : '❌ Rejetée');
    msg.style.color = error ? 'var(--cta-red)' : 'var(--teal)';
    setTimeout(loadList, 800);
  }

  function escapeHtml(str){
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
</script>
</body>
</html>
