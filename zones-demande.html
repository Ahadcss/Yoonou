<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yoonou — Zones à forte demande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<style>
  :root{--indigo-deep:#16213E; --laterite:#C1502E; --sand:#F3E9D2; --sand-dim:#E6D9BB; --teal:#2A7F76; --gold:#E8A93A; --ink:#1A1712; --muted:#4a4438;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Work Sans', sans-serif; background:var(--sand); color:var(--ink); min-height:100vh; padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  h1,h2{font-family:'Space Grotesk', sans-serif; font-weight:700;}
  nav{background:var(--indigo-deep); padding:calc(18px + env(safe-area-inset-top)) 0 18px;}
  nav .wrap{max-width:800px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center;}
  .logo{font-family:'Space Grotesk'; font-weight:700; font-size:20px; color:var(--sand); text-decoration:none; display:flex; align-items:center; gap:8px;}
  .dot{width:9px; height:9px; border-radius:50%; background:#E0623C;}
  .nav-link{color:var(--sand-dim); text-decoration:none; font-size:13.5px; font-family:'Space Grotesk'; font-weight:600;}
  .wrap{max-width:800px; margin:0 auto; padding:32px 24px;}
  .loading{text-align:center; padding:80px 20px; color:var(--muted);}
  .hidden{display:none !important;}
  h1{font-size:24px; margin-bottom:4px;}
  .subtitle{color:var(--muted); font-size:13.5px; margin-bottom:20px;}
  .period-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .period-tab{
    font-family:'Space Grotesk'; font-weight:600; font-size:13px; padding:9px 16px; border-radius:100px;
    border:1.5px solid rgba(22,33,62,0.15); background:#fff; color:var(--muted); cursor:pointer;
  }
  .period-tab.active{background:var(--indigo-deep); color:var(--sand); border-color:var(--indigo-deep);}
  #map{width:100%; height:60vh; min-height:400px; border-radius:12px;}
  .legend{
    display:flex; align-items:center; gap:10px; margin-top:14px; font-size:12.5px; color:var(--muted);
  }
  .legend-bar{height:10px; width:120px; border-radius:100px; background:linear-gradient(90deg, rgba(42,127,118,0.2), var(--gold), var(--laterite));}
  .empty-note{color:var(--muted); font-size:14px; text-align:center; padding:16px;}
</style>
</head>
<body>
<nav><div class="wrap"><a href="espace.html" class="logo"><span class="dot"></span>Yoonou</a><a href="espace.html" class="nav-link">← Mon espace</a></div></nav>
<div class="wrap">
  <div id="loadingState" class="loading">Chargement...</div>
  <div id="content" class="hidden">
    <h1>🔥 Zones à forte demande</h1>
    <p class="subtitle">Où les clients demandent le plus de transport en ce moment — positionne-toi intelligemment.</p>

    <div class="period-tabs">
      <button class="period-tab active" data-days="1">Aujourd'hui</button>
      <button class="period-tab" data-days="7">7 derniers jours</button>
      <button class="period-tab" data-days="30">30 derniers jours</button>
    </div>

    <div id="map"></div>
    <div class="legend">
      <span>Faible</span>
      <div class="legend-bar"></div>
      <span>Forte demande</span>
    </div>
    <div id="emptyNote" class="empty-note hidden">Pas encore assez de commandes récentes pour afficher une carte de demande.</div>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://fifzavvciqvdollbqigx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnphdnZjaXF2ZG9sbGJxaWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzMwNDgsImV4cCI6MjEwMjIwOTA0OH0.-Uj4_dULEPY4AfswEuUiC-4IOTOPOZd9j7JZD7pSTmY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  mapboxgl.accessToken = 'pk.eyJ1IjoieW9vbm91MTIxMiIsImEiOiJjbXRuenZoeWcwaWIwMnhzN2lhanhscmFzIn0.gySOX9l6uD89_QHvp6ppKA';

  let map = null;

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'auth.html'; return; }

    document.querySelectorAll('.period-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        loadHeatmap(parseInt(tab.dataset.days));
      });
    });

    initMap();
    await loadHeatmap(1);

    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  function initMap(){
    map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-17.4677, 14.7167], // Dakar
      zoom: 10.5
    });
  }

  async function loadHeatmap(days){
    const since = new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString();
    const { data, error } = await sb
      .from('orders')
      .select('depart_lat, depart_lng')
      .gte('created_at', since)
      .not('depart_lat', 'is', null)
      .not('depart_lng', 'is', null);

    if (error) { console.error(error); return; }

    const emptyNote = document.getElementById('emptyNote');
    if (!data || data.length < 3) {
      emptyNote.classList.remove('hidden');
    } else {
      emptyNote.classList.add('hidden');
    }

    const geojson = {
      type: 'FeatureCollection',
      features: (data || []).map(o => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [o.depart_lng, o.depart_lat] },
        properties: {}
      }))
    };

    function applyLayer(){
      if (map.getSource('demande')) {
        map.getSource('demande').setData(geojson);
        return;
      }
      map.addSource('demande', { type: 'geojson', data: geojson });
      map.addLayer({
        id: 'demande-heat',
        type: 'heatmap',
        source: 'demande',
        paint: {
          'heatmap-weight': 1,
          'heatmap-intensity': 1.1,
          'heatmap-color': [
            'interpolate', ['linear'], ['heatmap-density'],
            0, 'rgba(42,127,118,0)',
            0.2, 'rgba(42,127,118,0.5)',
            0.5, 'rgba(232,169,58,0.7)',
            0.8, 'rgba(224,98,60,0.85)',
            1, 'rgba(193,80,46,1)'
          ],
          'heatmap-radius': 32,
          'heatmap-opacity': 0.85
        }
      });
    }

    if (map.isStyleLoaded()) applyLayer();
    else map.once('load', applyLayer);
  }

  init();
</script>
</body>
</html>
